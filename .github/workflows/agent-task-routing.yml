name: Agent Task Routing

on:
  issues:
    types: [opened, labeled, reopened]

permissions:
  issues: write

jobs:
  route-by-label:
    runs-on: ubuntu-latest
    steps:
      - name: Assign role owner based on issue label
        uses: actions/github-script@v7
        with:
          script: |
            const issue = context.payload.issue;
            const labels = new Set((issue.labels || []).map((l) => l.name.toLowerCase()));

            const routes = [
              { label: 'planning', role: 'PM', assignee: 'copilot' },
              { label: 'architect', role: 'Architect', assignee: 'copilot' },
              { label: 'backend', role: 'Backend', assignee: 'copilot' },
              { label: 'frontend', role: 'Frontend', assignee: 'copilot' },
              { label: 'qa', role: 'QA', assignee: 'copilot' },
              { label: 'devops', role: 'DevOps', assignee: 'copilot' },
            ];

            const existingAssignees = new Set((issue.assignees || []).map((a) => a.login.toLowerCase()));
            const added = [];

            for (const route of routes) {
              if (!labels.has(route.label) || !route.assignee) {
                continue;
              }

              const assigneeLogin = route.assignee.toLowerCase();
              if (existingAssignees.has(assigneeLogin)) {
                continue;
              }

              try {
                await github.rest.issues.addAssignees({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issue.number,
                  assignees: [route.assignee],
                });
                existingAssignees.add(assigneeLogin);
                added.push(`${route.role}: @${route.assignee}`);
              } catch (error) {
                core.warning(`Could not assign @${route.assignee} for ${route.role}: ${error.message}`);
              }
            }

            if (added.length) {
              core.info(`Issue #${issue.number} auto-routed -> ${added.join(', ')}`);
            } else {
              core.info(`No assignee changes for issue #${issue.number}.`);
            }
